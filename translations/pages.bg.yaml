# FAQ Page
faq:
    title: 'Често задавани въпроси'
    intro: 'Отговори на най-честите въпроси за живот със стома. Кликнете върху въпрос за да разгънете отговора.'
    group_basics: 'Основни въпроси'
    group_pouch: 'Торбичка и оборудване'
    group_skin: 'Кожа и грижа'
    group_lifestyle: 'Начин на живот'
    group_support: 'Подкрепа и взаимоотношения'
    read_more: 'Прочети пълната статия'
    q1:
        question: 'Боли ли стомата?'
        answer: 'Не — самата стома няма нервни окончания и не боли при допир или при нормална употреба. Болка или дискомфорт около стомата обикновено означава дразнене на кожата под основата, което се дължи на изтичане. Ако изпитвате болка, свържете се с ентеростомния терапевт. <a href="/blog/vazstanovyavane-sled-operatsia">Прочети за възстановяването след операцията →</a>'
    q2:
        question: 'Временна или постоянна е стомата?'
        answer: 'Зависи от причината за операцията. Някои стоми са временни — червото се свързва обратно след няколко месеца. Други са постоянни. Хирургът ще обясни конкретно за вашия случай преди операцията. <a href="/blog/podgotovka-predi-operatsia">Прочети за подготовката преди операцията →</a>'
    q3:
        question: 'Всички стоми ли са еднакви?'
        answer: 'Не. Съществуват три основни вида: колостома (от дебелото черво), илеостома (от тънкото черво) и урострома (отвежда урина). Видът определя честотата на смяна и консистенцията на отделянията. <a href="/blog/podgotovka-predi-operatsia">Прочети повече за видовете стоми →</a>'
    q4:
        question: 'Колко често се сменя торбичката?'
        answer: 'Зависи от вида стома. При илеостома торбичката се изпразва 4–6 пъти дневно и се сменя на 1–3 дни. При колостома — по-рядко. <a href="/blog/smyana-na-torbichkata-kolko-chesto">Прочети пълното ръководство →</a>'
    q5:
        question: 'Какво е панкейкинг и как да го спра?'
        answer: 'Панкейкингът се случва когато двете страни на торбичката се залепят и отделянията не могат да се събират нормално. Решението е малко количество лубрикант в торбичката или торбичка с въглероден филтър. <a href="/blog/problemi-s-kozha-okolo-stomata">Виж повече проблеми и решения →</a>'
    q6:
        question: 'Как да спра изтичането?'
        answer: 'Изтичането почти винаги е следствие от неправилен размер на отвора в основата (трябва да е 2–3 мм по-голям от стомата), остаряла основа или неравна кожа. <a href="/blog/problemi-s-kozha-okolo-stomata">Прочети за причините и решенията →</a>'
    q7:
        question: 'Как да отлепя торбичката без да наранявам кожата?'
        answer: 'Използвайте спрей или кърпичка за отстраняване на медицинско лепило при всяка смяна. Поддържайте кожата с едната ръка и отлепвайте бавно отгоре надолу. Никога не дърпайте суха основа. <a href="/blog/premahvane-na-meditsinsko-lepilo">Прочети за средствата за отстраняване на лепило →</a>'
    q8:
        question: 'Как да предпазя кожата около стомата?'
        answer: 'Почиствайте с топла вода и суха кърпа, изчакайте кожата да изсъхне напълно и нанесете защитен филм преди поставянето на основата. Избягвайте кремове и овлажнители в зоната на стомата. <a href="/blog/grizha-za-kozha-okolo-stomata">Прочети пълното ръководство за кожата →</a>'
    q9:
        question: 'Мога ли да се къпя с торбичката?'
        answer: 'Да. Можете да се къпете под душ с торбичката или без нея — и двете са безопасни. Водата не уврежда стомата. При вана се препоръчва торбичката да остане, особено при илеостома. <a href="/blog/pochistvane-i-higiena-pri-smyana">Прочети за хигиената при смяна →</a>'
    q10:
        question: 'Мога ли да спортувам?'
        answer: 'Да — след възстановителния период (обикновено 6–8 седмици). Повечето спортове са безопасни. Носете прилепнало облекло над торбичката и изпразнете я преди тренировка. <a href="/blog/sport-i-fizicheska-aktivnost">Прочети пълното ръководство за спорт →</a>'
    q11:
        question: 'Какво да взема в самолет?'
        answer: 'Носете поне двоен запас в ръчния багаж. Вземете медицинско писмо от лекаря за охраната. Изпразнете торбичката преди качване. <a href="/blog/patuvane-s-ostoma">Прочети пълното ръководство за пътуване →</a>'
    q12:
        question: 'Влияе ли диетата на стомата?'
        answer: 'Да. Някои храни сгъстяват отделянията (ориз, банан, картофи), други ги разреждат (кафе, алкохол, плодове). При илеостома хидратацията е особено важна. <a href="/blog/dieta-i-hidratatsia">Прочети пълното ръководство за диета →</a>'
    q13:
        question: 'Какви видове торбички съществуват?'
        answer: 'Съществуват два основни вида — затворени (за еднократна употреба) и дренируеми (с клапа или скоба, изпразват се многократно). Урострома торбичките имат дренажна система за урина. При двукомпонентните системи основата и торбичката са отделни части и се сменят независимо.'
    q14:
        question: 'Какво е балониране на торбичката?'
        answer: 'Балонирането се случва когато въздухът се задържа вътре в торбичката и я надува. Намалете газообразуващите храни (боб, карфиол, газирани напитки) и избягвайте да дъвчете дъвка. Торбичките с въглероден филтър отвеждат газа автоматично и предотвратяват балонирането.'
    q15:
        question: 'Кога да изпразня или сменя торбичката?'
        answer: 'Дренируемата торбичка се изпразва когато е запълнена на около 1/3. Затворената торбичка се сменя след всяко изпразване. Честотата зависи от вида стома и личните предпочитания — ентеростомният терапевт ще даде персонализиран съвет. <a href="/blog/smyana-na-torbichkata-kolko-chesto">Прочети пълното ръководство →</a>'
    q16:
        question: 'Как се изхвърля използвана торбичка?'
        answer: 'Увийте торбичката в хигиенна торбичка или хартия и я изхвърлете с битовите отпадъци. Никога не хвърляйте торбичката в тоалетната — може да запуши канализацията.'
    q17:
        question: 'Какво представляват продуктите за грижа за стомата?'
        answer: 'Това са допълнителни консумативи за решаване на честите проблеми: защитни филми за кожата, спрейове за отстраняване на лепило, гелове за сгъстяване на отделянията, средства срещу миризми и лубриканти срещу панкейкинг. Попитайте ентеростомния терапевт кои са подходящи за вас. <a href="/blog/grizha-za-kozha-okolo-stomata">Прочети пълното ръководство за грижата →</a>'
    q18:
        question: 'Кожата ми е наранена от отлепянето на торбичката. Какво да направя?'
        answer: 'Използвайте спрей или кърпичка за отстраняване на лепило при всяко отлепяне — значително намалява раздразнението. Поддържайте кожата с пръсти и отлепвайте бавно. Ако раздразнението продължава, консултирайте се с ентеростомния терапевт. <a href="/blog/premahvane-na-meditsinsko-lepilo">Прочети за средствата за отстраняване на лепило →</a>'
    q19:
        question: 'Ще забележат ли другите торбичката?'
        answer: 'В повечето случаи не — особено след оздравяването. Торбичката е плоска под дрехите. Помагат прилепнало бельо, тъмни цветове и малко по-свободни горни дрехи. Съществуват и специални коланчета и покривала за торбички.'
    q20:
        question: 'Притеснявам се от миризми. Какво да направя?'
        answer: 'Съвременните торбички са херметично затворени и при нормална употреба не пропускат миризма. При смяна използвайте дезодориращи дропове или спрей вътре в торбичката. Идентифицирайте и ограничете храните, които усилват миризмата при вас.'
    q21:
        question: 'Мога ли да нося нормални дрехи?'
        answer: 'Да. Повечето хора носят обичайните си дрехи след оздравяването. Избягвайте много тесни колани директно върху стомата. Специалното бельо и коланчета за хора с торбичка осигуряват допълнителна поддръжка и дискретност.'
    q22:
        question: 'Работя в тих офис и се притеснявам от шум и миризми. Какво да направя?'
        answer: 'Газовете могат да се контролират чрез диета и торбички с въглероден филтър. При смяна използвайте дезодориращи продукти и изпразнете торбичката преди важни срещи. Повечето колеги няма да усетят нищо — съвременните торбички са проектирани за дискретност.'
    q23:
        question: 'Трудно ми е да се примиря с живота с торбичка. Как да получа помощ?'
        answer: 'Напълно нормално е да изпитвате трудности в началото. Свържете се с ентеростомния терапевт или потърсете подкрепа от пациентски организации и онлайн общности. Разговорът с хора, минали през същото, може да помогне изключително много. <a href="/blog/psihologicheska-podkrepa">Прочети за психологическата подкрепа →</a>'
    q24:
        question: 'Как да обясня стомата на нов партньор?'
        answer: 'Изберете спокоен момент и обяснете с прости думи — защо е направена операцията и как се е отразила на живота ви. Акцентирайте на позитивното: стомата е позволила да се върнете към активен живот. Много хора с торбичка водят пълноценен интимен живот. <a href="/blog/intimnost-i-vzaimootnoshenia">Прочети за интимността с остома →</a>'
    q25:
        question: 'Партньорът ми има стома. Откъде да разбера повече?'
        answer: 'Бъдете търпеливи и не задавайте прекалено много въпроси наведнъж. Предложете да придружите партньора си на консултация при терапевта ако е готов. Потърсете информация от авторитетни медицински източници. <a href="/blog/kak-da-kazhete-na-blizkite">Прочети как да разкажете на близките →</a>'

# Terms of Use Page
terms:
    title: 'Условия за ползване'
    content: |
        <h3>1. Общи условия</h3>
        <p>С използването на този уебсайт вие се съгласявате с настоящите условия за ползване. Ако не сте съгласни с тези условия, моля не използвайте сайта.</p>

        <h3>2. Описание на услугата</h3>
        <p>Medical предоставя безплатни мостри на медицински консумативи, предназначени за лица, които имат нужда от продукти за извънболнична грижа след медицински процедури или операции.</p>
        <p>Услугата е достъпна за всички пълнолетни лица (над 18 години), които имат нужда от такива продукти за лична употреба.</p>

        <h3>3. Заявка за мостри</h3>
        <p>При заявка за мостри вие се съгласявате, че:</p>
        <ul>
            <li>Предоставената от вас информация е вярна и актуална</li>
            <li>Мострите са предназначени за лична употреба и оценка на продукта</li>
            <li>Няма да препродавате или разпространявате получените мостри</li>
            <li>Ще използвате продуктите съгласно приложените инструкции</li>
        </ul>

        <h3>4. Ограничения</h3>
        <p>Запазваме правото да:</p>
        <ul>
            <li>Ограничим броя на мострите на едно лице</li>
            <li>Откажем заявка без обяснение</li>
            <li>Променим или прекратим услугата по всяко време</li>
        </ul>

        <h3>5. Медицински отказ от отговорност</h3>
        <p><strong>Важно:</strong> Информацията на този сайт и предоставените мостри не заместват професионален медицински съвет, диагноза или лечение. Винаги се консултирайте с лекар или друг квалифициран здравен специалист относно вашето здравословно състояние.</p>
        <p>Ако изпитвате сериозни симптоми или имате спешна нужда от медицинска помощ, моля обърнете се към най-близкото здравно заведение.</p>

        <h3>6. Ограничаване на отговорността</h3>
        <p>Medical не носи отговорност за:</p>
        <ul>
            <li>Алергични реакции или нежелани ефекти от използването на продуктите</li>
            <li>Неправилна употреба на мострите</li>
            <li>Закъснение или невъзможност за доставка поради форсмажорни обстоятелства</li>
            <li>Индиректни или последващи щети</li>
        </ul>
        <p>Използването на мострите е изцяло на ваш риск.</p>

        <h3>7. Интелектуална собственост</h3>
        <p>Всички материали на този сайт, включително текстове, изображения, лога и дизайн, са защитени от авторско право и принадлежат на Medical или на съответните им собственици. Забранено е копирането, разпространението или използването на тези материали без изрично писмено съгласие.</p>

        <h3>8. Връзки към други сайтове</h3>
        <p>Сайтът може да съдържа връзки към външни уебсайтове. Ние не носим отговорност за съдържанието или политиките за поверителност на тези сайтове.</p>

        <h3>9. Промени в условията</h3>
        <p>Запазваме правото да актуализираме тези условия по всяко време. Промените влизат в сила от момента на публикуването им на сайта. Продължавайки да използвате сайта след промени, вие приемате новите условия.</p>

        <h3>10. Приложимо право</h3>
        <p>Тези условия се уреждат от законодателството на Република България. Всички спорове ще бъдат решавани от компетентните български съдилища.</p>

        <h3>11. Контакт</h3>
        <p>За въпроси относно тези условия, моля свържете се с нас на: <strong>%app_email%</strong></p>

# Privacy Policy Page
privacy:
    title: 'Политика за поверителност'
    content: |
        <h3>1. Администратор на лични данни</h3>
        <p>Администратор на вашите лични данни е физическото лице, управляващо уебсайта Medical, с ЕГН <strong>1234567890</strong>. За въпроси относно обработката на лични данни можете да се свържете с нас на: <strong>%app_email%</strong></p>

        <h3>2. Какви данни събираме</h3>
        <p>Събираме следните категории лични данни:</p>
        <ul>
            <li><strong>Данни за идентификация:</strong> име</li>
            <li><strong>Данни за контакт:</strong> имейл адрес, телефонен номер</li>
            <li><strong>Данни за доставка:</strong> адрес, град, пощенски код (при заявка за мостра)</li>
            <li><strong>Комуникация:</strong> съдържание на съобщенията, които ни изпращате</li>
        </ul>

        <h3>3. Защо събираме вашите данни</h3>
        <p>Обработваме вашите лични данни за следните цели:</p>
        <ul>
            <li>Обработка на заявки за мостри на медицински продукти</li>
            <li>Отговор на вашите въпроси и запитвания</li>
            <li>Изпращане на заявените мостри на посочения адрес</li>
            <li>Комуникация във връзка с вашите заявки</li>
        </ul>

        <h3>4. Правно основание за обработка</h3>
        <p>Обработваме вашите данни на следните правни основания:</p>
        <ul>
            <li><strong>Съгласие (чл. 6, ал. 1, буква "а" от GDPR):</strong> Когато изпращате контактна форма, вие давате изрично съгласие за обработка на данните си.</li>
            <li><strong>Изпълнение на договор (чл. 6, ал. 1, буква "б" от GDPR):</strong> За изпращане на заявените мостри.</li>
            <li><strong>Законен интерес (чл. 6, ал. 1, буква "е" от GDPR):</strong> За подобряване качеството на нашите услуги и оптимизиране на разпределението на мостри въз основа на анализ на постъпилите заявки. Законният ни интерес не надхвърля разумните очаквания на субектите на данни.</li>
        </ul>

        <h3>5. Задължителност на предоставяне на данни</h3>
        <p>Предоставянето на лични данни чрез контактната форма е <strong>доброволно</strong>, но необходимо за получаване на исканата услуга. Полетата „Име", „Имейл", „Телефон" и „Съобщение" са задължителни за обработка на вашата заявка. При непредоставяне на тези данни не е възможно да изпратим мостра или да отговорим на вашето запитване.</p>

